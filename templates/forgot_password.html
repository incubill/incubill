<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Incubill</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{

            width:400px;
            background:white;
            padding:35px;
            border-radius:12px;
            box-shadow:0 8px 30px rgba(0,0,0,.1);

        }

        h1{

            text-align:center;
            color:#1f2937;
            margin-bottom:10px;

        }

        p{

            color:#6b7280;
            text-align:center;
            margin-bottom:30px;

        }

        label{

            display:block;
            margin-bottom:8px;
            color:#374151;
            font-weight:bold;

        }

        input{

            width:100%;
            padding:12px;
            border:1px solid #d1d5db;
            border-radius:8px;
            margin-bottom:20px;

        }

        button{

            width:100%;
            background:#2563eb;
            color:white;
            border:none;
            padding:14px;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;

        }

        button:hover{

            background:#1d4ed8;

        }

        .back{

            margin-top:20px;
            text-align:center;

        }

        .back a{

            color:#2563eb;
            text-decoration:none;

        }

        .flash{

            background:#dbeafe;
            color:#1e40af;
            padding:12px;
            border-radius:8px;
            margin-bottom:20px;
            text-align:center;

        }

    </style>

</head>

<body>

<div class="card">

<h1>Forgot Password</h1>

<p>
Enter your email address and we'll send you a password reset link.
</p>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, message in messages %}

<div class="flash">
{{ message }}
</div>

{% endfor %}
{% endif %}
{% endwith %}

<form method="POST">

<label>Email Address</label>

<input
type="email"
name="email"
placeholder="you@example.com"
required>

<button type="submit">
Send Reset Link
</button>

</form>

<div class="back">

<a href="{{ url_for('login') }}">
← Back to Login
</a>

</div>

</div>

</body>
</html>
