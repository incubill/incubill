<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Incubill</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;

            color: #1f2937;

            font-size: 32px;

            margin-bottom: 12px;
        }

        .description {
            color: #6b7280;

            text-align: center;

            font-size: 16px;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #374151;

            font-weight: 600;
        }

        input[type="email"] {
            width: 100%;

            padding: 14px 16px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 16px;

            outline: none;

            margin-bottom: 20px;
        }

        input[type="email"]:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .flash {
            padding: 12px 14px;

            margin-bottom: 20px;

            border-radius: 8px;

            text-align: center;

            background: #dbeafe;

            color: #1e40af;

            font-size: 14px;
        }

        .back {
            text-align: center;

            margin-top: 24px;
        }

        .back a {
            color: #2563eb;

            text-decoration: none;

            font-weight: 500;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Forgot Password</h1>

    <p class="description">
        Enter your email address and we'll send you a password reset link.
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="flash">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label for="email">
            Email Address
        </label>

        <input
            id="email"
            type="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
        >

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <div class="back">
        <a href="{{ url_for('login') }}">
            ← Back to Login
        </a>
    </div>

</div>

</body>
</html>
