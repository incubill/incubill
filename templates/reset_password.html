<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Incubill</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{

            background:#f5f7fb;

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;

        }

        .card{

            width:420px;

            background:white;

            padding:35px;

            border-radius:12px;

            box-shadow:0 8px 30px rgba(0,0,0,.1);

        }

        h1{

            text-align:center;

            color:#1f2937;

            margin-bottom:15px;

        }

        p{

            color:#6b7280;

            text-align:center;

            margin-bottom:25px;

        }

        input{

            width:100%;

            padding:12px;

            margin-bottom:18px;

            border:1px solid #d1d5db;

            border-radius:8px;

        }

        button{

            width:100%;

            padding:14px;

            border:none;

            border-radius:8px;

            background:#2563eb;

            color:white;

            font-size:16px;

            cursor:pointer;

        }

        button:hover{

            background:#1d4ed8;

        }

        .flash{

            padding:12px;

            margin-bottom:20px;

            border-radius:8px;

            background:#dbeafe;

            color:#1e40af;

        }

        .back{

            text-align:center;

            margin-top:20px;

        }

        .back a{

            text-decoration:none;

            color:#2563eb;

        }

    </style>

</head>

<body>

<div class="card">

<h1>Create New Password</h1>

<p>
Enter your new password below.
</p>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, message in messages %}

<div class="flash">
{{ message }}
</div>

{% endfor %}
{% endif %}
{% endwith %}

<form method="POST">

<input
type="password"
name="password"
placeholder="New Password"
required>

<input
type="password"
name="confirm_password"
placeholder="Confirm Password"
required>

<button type="submit">

Reset Password

</button>

</form>

<div class="back">

<a href="{{ url_for('login') }}">

Back to Login

</a>

</div>

</div>

</body>

</html>
